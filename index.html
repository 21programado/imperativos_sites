<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Con Su Palabra Hoy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center items-center p-4">

  <main class="w-full max-w-md bg-slate-800 rounded-xl shadow-xl p-6 text-center border border-slate-700">
    <h2 class="text-xl font-bold text-amber-400 mb-4">Con Su Palabra Hoy</h2>

    <!-- Contenedor del Versículo (Sin botones) -->
    <div id="contenedorVersiculo" class="bg-slate-900/60 p-6 rounded-lg border border-slate-700/80 min-h-[140px] flex flex-col justify-center items-center">
      <p id="textoVerso" class="text-base italic text-slate-200 mb-3 leading-relaxed">Cargando...</p>
      <span id="pasajeVerso" class="text-xs font-semibold text-amber-400"></span>
    </div>
  </main>

  <script>
    async function obtenerVersiculoDelDia() {
      const textoVerso = document.getElementById('textoVerso');
      const pasajeVerso = document.getElementById('pasajeVerso');

      try {
        const respuesta = await fetch('./versiculos.json');
        if (!respuesta.ok) throw new Error('No se pudo cargar el archivo JSON');
        
        const versiculos = await respuesta.json();

        if (versiculos.length > 0) {
          // 1. Obtener el día actual del año (ejemplo: día 1 al 365)
          const hoy = new Date();
          const inicioAno = new Date(hoy.getFullYear(), 0, 0);
          const diferenciaMs = hoy - inicioAno;
          const unDiaMs = 1000 * 60 * 60 * 24;
          const diaDelAno = Math.floor(diferenciaMs / unDiaMs);

          // 2. Seleccionar el versículo según el día del año
          // Usamos el operador módulo (%) para que rote ciclícamente si hay menos versículos que días
          const indiceHoy = diaDelAno % versiculos.length;
          const versiculoHoy = versiculos[indiceHoy];

          // 3. Mostrar en pantalla
          textoVerso.textContent = versiculoHoy.texto;
          pasajeVerso.textContent = versiculoHoy.pasaje;
        } else {
          textoVerso.textContent = "No hay versículos en la lista.";
        }
      } catch (error) {
        console.error(error);
        textoVerso.textContent = "Error al obtener el versículo del día.";
      }
    }

    // Ejecutar al cargar la página
    obtenerVersiculoDelDia();
  </script>
</body>
</html>
